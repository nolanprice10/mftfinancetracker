<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyFinanceTracker is offline</title>
    <meta name="theme-color" content="#ffffff" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ed;
        --panel: rgba(255, 255, 255, 0.85);
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --border: rgba(15, 118, 110, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 32%),
          radial-gradient(circle at bottom right, rgba(180, 83, 9, 0.12), transparent 28%),
          var(--bg);
        color: var(--text);
        padding: 24px;
      }

      .card {
        width: min(560px, 100%);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        padding: 32px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        background: rgba(15, 118, 110, 0.08);
        padding: 8px 12px;
        border-radius: 999px;
      }

      h1 {
        margin: 20px 0 12px;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
      }

      .button.primary {
        background: var(--accent);
        color: white;
      }

      .button.secondary {
        border: 1px solid var(--border);
        color: var(--text);
        background: rgba(255, 255, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Offline ready</div>
      <h1>You’re offline, but your tracker is still here.</h1>
      <p>
        MyFinanceTracker saved its shell and will reconnect automatically when your network returns.
        You can keep reviewing the last cached screen or head back to the dashboard.
      </p>
      <div class="actions">
        <a class="button primary" href="./">Go to dashboard</a>
        <a class="button secondary" href="./transactions">Open transactions</a>
      </div>
    </main>
  </body>
</html>
