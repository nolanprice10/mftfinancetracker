name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scan Git history for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Restore source HTML template for build
        run: |
          if [ -f index.source.html ]; then
            cp index.source.html index.html
            echo "Restored index.html from index.source.html"
          else
            echo "index.source.html is missing; cannot prepare source template"
            exit 1
          fi

      - name: Build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: |
          if [ -f public/CNAME ]; then
            echo "Custom domain detected via public/CNAME; building with root base path"
            export VITE_APP_BASE_PATH="/"
          else
            echo "No CNAME found; building for GitHub Pages project path"
            export VITE_APP_BASE_PATH="/${{ github.event.repository.name }}/"
          fi
          echo "VITE_APP_BASE_PATH=$VITE_APP_BASE_PATH"
          npm run build

      - name: Check client bundle for server-only secrets
        run: npm run security:bundle

      - name: Verify build output
        run: |
          echo "📦 Build output:"
          ls -la dist/
          echo ""
          echo "📄 Checking for key files:"
          [ -f dist/index.html ] && echo "✓ index.html exists" || echo "✗ index.html missing"
          [ -f dist/404.html ] && echo "✓ 404.html exists" || echo "✗ 404.html missing"
          echo ""
          echo "📁 Assets folder:"
          ls -la dist/assets/ 2>/dev/null || echo "No assets folder"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
