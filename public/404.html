<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | MyFinanceTracker</title>
    <meta name="description" content="The page you are looking for was not found." />
    <meta name="robots" content="noindex,follow" />
    <style>
      :root {
        --bg: #f8faf7;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(92vw, 560px);
        background: var(--card);
        border: 1px solid #d1d5db;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 45px rgba(15, 118, 110, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .actions {
        margin-top: 20px;
      }
      a {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 10px;
        font-weight: 600;
      }
      a:hover {
        filter: brightness(0.95);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404: Page Not Found</h1>
      <p>This page does not exist or has moved. You can return to the homepage and continue tracking your finances.</p>
      <div class="actions">
        <a href="/">Go to Homepage</a>
      </div>
    </main>
  </body>
</html>
